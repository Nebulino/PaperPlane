name: Publish to pub.dev

# Pub.dev → package → Admin → "Automated publishing" must be enabled with:
#   repository:  Nebulino/PaperPlane
#   tag pattern: v{{version}}
# Then publish with:
#   git tag v0.7.0 && git push origin v0.7.0
# (`version:` in pubspec.yaml must match the tag, minus the leading "v")

on:
  # Manual run: in the GitHub UI pick the TAG as the ref, not a branch —
  # OIDC only authorizes runs whose ref matches the tag pattern on pub.dev.
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'          # v0.7.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'        # v0.7.0-beta.1 (pre-releases)

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      id-token: write   # required for OIDC authentication to pub.dev
      contents: read
    # Official Dart Team reusable workflow: sets up the Dart SDK, provides the
    # OIDC token, runs `dart pub publish --dry-run` then `dart pub publish -f`.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

# ---------------------------------------------------------------------------
# FALLBACK — only if you cannot use pub.dev's OIDC "Automated publishing".
